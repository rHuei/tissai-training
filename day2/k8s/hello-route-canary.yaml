apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-route
spec:
  parentRefs:
  - name: apps-gw
    namespace: apps-gateway
  hostnames:
  - hello.apps.k8s.tiss.internal
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: hello-service
      port: 4000
      weight: 90
    - name: hello-canary
      port: 4000
      weight: 10

