apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ① 要處理哪些 YAML
resources:
- deployment.yaml
- service.yaml
# ② 全部放到這個 namespace
namespace: fg01
# ③ 全部加上這個標籤
labels:
- pairs: {team: fg01}
# ④ 換 image（不用改 deployment.yaml）
images:
- name: hello
  newName: harbor.tiss.internal/fg01/hello
  newTag: v5
# ⑤ 改副本數
replicas:
- name: hello-deployment
  count: 2
# ⑥ 由 Kustomize 產生 ConfigMap（名稱會加上內容的 hash）
configMapGenerator:
- name: hello-env
  literals: [NAME=K8S]
