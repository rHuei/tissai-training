# 題 1：Pod 一直起不來 → ImagePullBackOff（tag 打錯）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-1
spec:
  replicas: 1
  selector:
    matchLabels: {app: broken-1}
  template:
    metadata:
      labels: {app: broken-1}
    spec:
      containers:
      - name: hello
        image: harbor.tiss.internal/fg01/hello:v9          # 錯誤：Harbor 上沒有 v9
        command: ["python", "app.py"]
        ports:
        - containerPort: 80
