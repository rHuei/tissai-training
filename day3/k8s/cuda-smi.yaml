# 1.3 不透過 Run:ai 跑一個 GPU Pod（只為了看懂底層，日常請用 Run:ai 送出）
# nodeSelector 的值以 kubectl get nodes -L nvidia.com/gpu.product 看到的為準
apiVersion: v1
kind: Pod
metadata:
  name: cuda-smi
spec:
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-H200
  containers:
  - name: cuda
    image: harbor.tiss.internal/nvidia/cuda:12.6.3-base-ubuntu24.04
    command: ["nvidia-smi"]
    resources:
      limits:
        nvidia.com/gpu: 1
